services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outpatient_booking
      POSTGRES_PASSWORD: outpatient_booking
      POSTGRES_DB: outpatient_booking
    ports:
      - "5432:5432"
    volumes:
      - outpatient_booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outpatient_booking -d outpatient_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  outpatient_booking_pgdata:
